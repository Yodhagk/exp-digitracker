name: Deploy DigiTracker

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run pending SQL migrations'
        required: false
        default: 'true'
        type: boolean

jobs:
  deploy:
    name: Deploy to Production (192.168.1.138)
    runs-on: [self-hosted, digitracker-prod]
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show deploying commit
        run: |
          echo "Deploying commit: $(git log -1 --pretty='%h %s' HEAD)"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Triggered by: $GITHUB_ACTOR"

      # Runs first and fails loudly if a required secret is missing, so a
      # misconfigured deploy aborts here and never touches the live app.
      - name: Write runtime secrets
        env:
          DB_HOST:             ${{ secrets.DB_HOST }}
          DB_NAME:             ${{ secrets.DB_NAME }}
          DB_USER:             ${{ secrets.DB_USER }}
          DB_PASS:             ${{ secrets.DB_PASS }}
          GMAIL_CLIENT_ID:     ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REDIRECT_URI:  ${{ secrets.GMAIL_REDIRECT_URI }}
          DUCKDNS_TOKEN:       ${{ secrets.DUCKDNS_TOKEN }}
          DUCKDNS_DOMAIN:      ${{ secrets.DUCKDNS_DOMAIN }}
        run: bash scripts/write-secrets.sh

      # Order matters here: back up before anything changes, then apply schema
      # migrations BEFORE the new PHP files that assume they already ran (e.g.
      # login.php querying a users.role column added by migrate_v6.sql). Migrations
      # only add columns/tables, so the still-live old code never notices them —
      # deploying the new code first would instead open a window where every
      # login attempt against the old schema throws.
      - name: Backup database
        run: sudo /var/app/script/backup-db.sh

      - name: Run pending migrations
        if: ${{ github.event.inputs.run_migrations != 'false' }}
        run: bash scripts/run-migrations.sh

      - name: Deploy PHP app files
        run: bash scripts/deploy-app.sh

      - name: Reload Apache
        run: sudo systemctl reload apache2

      - name: Run health check
        run: |
          set +e
          /var/app/script/healthcheck.sh
          hc=$?
          # exit 0=healthy, 1=degraded(warnings only), 2=critical(failures)
          [ $hc -lt 2 ] || { echo "Health check CRITICAL — aborting deployment"; exit 1; }
          [ $hc -eq 0 ] && echo "Health: HEALTHY" || echo "Health: DEGRADED (warnings present)"

      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/)
          echo "HTTP $code"
          [ "$code" -eq 200 ] || [ "$code" -eq 302 ] || { echo "Smoke test FAILED: HTTP $code"; exit 1; }
          echo "Smoke test PASSED"

      # TEMPORARY — diagnosing the shopping.php 500. php_errors.log is 0640
      # root:www-data, unreadable by the interactive SSH user; sudo cp + chmod
      # are both already NOPASSWD for this runner, which a bare `sudo cat`
      # would not be. Remove this step once the log has been read.
      - name: TEMP - dump php error log
        run: |
          sudo cp /var/app/logs/php_errors.log /tmp/php_err_dump.log
          sudo chmod 644 /tmp/php_err_dump.log
          echo "=== last 100 lines of php_errors.log ==="
          tail -100 /tmp/php_err_dump.log
