# DigiTracker - HTTPS Virtual Host (Gmail OAuth)
# Location: /etc/apache2/sites-available/digitracker-ssl.conf
#
# Google rejects http:// redirect URIs for sensitive/restricted scopes
# (gmail.readonly), so this exists purely to give the OAuth callback a
# https:// endpoint. Kept separate from vhost.conf (the port-80 vhost)
# because Apache refuses to even start if a loaded vhost's
# SSLCertificateFile doesn't exist — this file must only be enabled
# (a2ensite) after certbot has actually issued the certificate.
#
# Requires: sudo a2enmod ssl headers
# Enable with: sudo a2ensite digitracker-ssl && sudo systemctl reload apache2

# Redeclaring this here (identical to vhost.conf) makes the file self-contained —
# sites-enabled/*.conf loads alphabetically, and "digitracker-ssl.conf" sorts
# before "digitracker.conf", so this vhost cannot rely on the other file having
# defined the format first.
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %Dms" digitracker_timed

<VirtualHost *:443>
    DocumentRoot /var/www/html/digitracker
    ServerName   digitracker.duckdns.org

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/digitracker.duckdns.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/digitracker.duckdns.org/privkey.pem

    <Directory /var/www/html/digitracker>
        Options       FollowSymLinks
        AllowOverride All
        Require       all granted
    </Directory>

    ErrorLog  /var/app/logs/apache_error.log
    CustomLog /var/app/logs/apache_access.log digitracker_timed

    php_admin_value error_log      /var/app/logs/php_errors.log
    php_admin_flag  log_errors     On
    php_admin_flag  display_errors Off

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=15768000"
</VirtualHost>
